name: Build Veynor Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veynor-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          build-root-directory: veynor-client
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: veynor-client-jar
          path: veynor-client/build/libs/*.jar
